name: Attach Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (e.g. v0.3.0)"
        required: true
        type: string

permissions: {}

jobs:
  attach-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and validate release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag format: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Verify artifacts, generate SHA256SUMS, and upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          test -f paper/prime-cadences.pdf
          test -f arxiv/prime-cadences-arxiv.tar.gz

          python3 - <<'PY'
          import pathlib, re, sys
          pdf = pathlib.Path("paper/prime-cadences.pdf").read_bytes()
          rx = re.compile(rb"(/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+\\|" + b"file:" + b"///)")
          if rx.search(pdf):
              print("::error::Local path metadata match in paper/prime-cadences.pdf", file=sys.stderr)
              sys.exit(1)
          print("PDF hygiene check passed.")
          PY

          mkdir -p release-assets
          cp paper/prime-cadences.pdf release-assets/prime-cadences.pdf
          cp arxiv/prime-cadences-arxiv.tar.gz release-assets/prime-cadences-arxiv.tar.gz
          (cd release-assets && sha256sum prime-cadences.pdf prime-cadences-arxiv.tar.gz > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

          gh release upload "$TAG" \
            release-assets/prime-cadences.pdf \
            release-assets/prime-cadences-arxiv.tar.gz \
            release-assets/SHA256SUMS.txt \
            --clobber
