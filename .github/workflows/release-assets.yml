name: Publish Immutable Release Assets

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish or attach to a draft release (e.g. v0.4.0)"
        required: true
        type: string
      title:
        description: "Optional release title (defaults to tag if creating a new release)"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and validate release tag and mode
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag format (expected vX.Y.Z): $TAG"
            exit 1
          fi

          MODE="create"
          CHECKOUT_REF="refs/tags/$TAG"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > /tmp/rel.json 2>/dev/null; then
            IS_DRAFT="$(python3 -c 'import json; print(str(json.load(open("/tmp/rel.json"))["isDraft"]).lower())')"
            TARGET_COMMITISH="$(python3 -c 'import json; print(json.load(open("/tmp/rel.json"))["targetCommitish"])')"
            if [[ "$IS_DRAFT" == "true" ]]; then
              MODE="draft"
              CHECKOUT_REF="$TARGET_COMMITISH"
            else
              echo "::error::Release $TAG is already published; immutable releases cannot be modified after publication (see NEG-E11)."
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "title=${INPUT_TITLE:-Morpheus $TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          fetch-depth: 1

      - name: Verify artifacts, generate SHA256SUMS, and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          MODE: ${{ steps.resolve.outputs.mode }}
          TITLE: ${{ steps.resolve.outputs.title }}
        run: |
          set -euo pipefail

          PDFS=(
            "paper/prime-cadences.pdf"
            "papers/horizon_synthesis/piece1_propulsion_hardware/paper/piece1_propulsion_hardware.pdf"
            "papers/horizon_synthesis/piece2_smallbody_crtbp/paper/piece2_smallbody_crtbp.pdf"
            "papers/horizon_synthesis/piece3_nullcone_tuft_hagedorn/paper/piece3_nullcone_tuft_hagedorn.pdf"
            "papers/triadic_wreath_nauru/paper/triadic_wreath_nauru.pdf"
          )
          TARS=(
            "arxiv/prime-cadences-arxiv.tar.gz"
            "papers/horizon_synthesis/piece1_propulsion_hardware/arxiv/piece1-propulsion-hardware-arxiv.tar.gz"
            "papers/horizon_synthesis/piece2_smallbody_crtbp/arxiv/piece2-smallbody-crtbp-arxiv.tar.gz"
            "papers/horizon_synthesis/piece3_nullcone_tuft_hagedorn/arxiv/piece3-nullcone-tuft-hagedorn-arxiv.tar.gz"
            "papers/triadic_wreath_nauru/arxiv/triadic-wreath-nauru-arxiv.tar.gz"
          )

          for f in "${PDFS[@]}" "${TARS[@]}"; do
            test -f "$f"
          done

          python3 - <<'PY'
          import pathlib, re, sys, tarfile

          pdfs = [
              "paper/prime-cadences.pdf",
              "papers/horizon_synthesis/piece1_propulsion_hardware/paper/piece1_propulsion_hardware.pdf",
              "papers/horizon_synthesis/piece2_smallbody_crtbp/paper/piece2_smallbody_crtbp.pdf",
              "papers/horizon_synthesis/piece3_nullcone_tuft_hagedorn/paper/piece3_nullcone_tuft_hagedorn.pdf",
              "papers/triadic_wreath_nauru/paper/triadic_wreath_nauru.pdf",
          ]
          tars = [
              "arxiv/prime-cadences-arxiv.tar.gz",
              "papers/horizon_synthesis/piece1_propulsion_hardware/arxiv/piece1-propulsion-hardware-arxiv.tar.gz",
              "papers/horizon_synthesis/piece2_smallbody_crtbp/arxiv/piece2-smallbody-crtbp-arxiv.tar.gz",
              "papers/horizon_synthesis/piece3_nullcone_tuft_hagedorn/arxiv/piece3-nullcone-tuft-hagedorn-arxiv.tar.gz",
              "papers/triadic_wreath_nauru/arxiv/triadic-wreath-nauru-arxiv.tar.gz",
          ]

          rx = re.compile(rb"(/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+\\|" + b"file:" + b"///)")
          for rel in pdfs:
              if rx.search(pathlib.Path(rel).read_bytes()):
                  print(f"::error::Local path metadata match in {rel}", file=sys.stderr)
                  sys.exit(1)

          for rel in tars:
              with tarfile.open(rel, "r:gz") as tf:
                  for m in tf.getmembers():
                      if m.uid != 0 or m.gid != 0 or m.uname != "" or m.gname != "":
                          print(f"::error::Non-neutral tar header in {rel}: {m.name} ({m.uid}/{m.gid} {m.uname}/{m.gname})", file=sys.stderr)
                          sys.exit(1)

          print(f"PDF ({len(pdfs)}) and neutral-tar ({len(tars)}) hygiene checks passed.")
          PY

          mkdir -p release-assets
          for f in "${PDFS[@]}" "${TARS[@]}"; do
            cp "$f" "release-assets/$(basename "$f")"
          done
          (cd release-assets && sha256sum *.pdf *.tar.gz > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

          if [[ "$MODE" == "draft" ]]; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" \
              release-assets/*.pdf \
              release-assets/*.tar.gz \
              release-assets/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
          else
            python3 - <<'PY'
          import os, pathlib, re

          tag = os.environ["TAG"]
          ver = tag.lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", changelog, re.M | re.S)
          body = m.group(1).strip() if m else f"Release {tag} of Morpheus."
          sums = pathlib.Path("release-assets/SHA256SUMS.txt").read_text(encoding="utf-8").strip()
          notes = f"{body}\n\n### Attached Release Assets (`SHA256SUMS.txt`)\n```text\n{sums}\n```\n"
          pathlib.Path("release-assets/RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          PY
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              release-assets/*.pdf \
              release-assets/*.tar.gz \
              release-assets/SHA256SUMS.txt \
              --verify-tag \
              --title "$TITLE" \
              --notes-file release-assets/RELEASE_NOTES.md
          fi
